[package]
name = "RustyPi5"
version = "0.10.0"
authors = ["Kevin Wood <kevin.j.wood@gmail.com>"]
edition = "2021"

[features]
default = []
debug_prints = []
bsp_rpi3 = ["tock-registers"]
bsp_rpi4 = ["tock-registers"]
bsp_rpi5 = ["tock-registers"]
bsp_host = []
bsp_hyperv_x86 = []
bsp_qemu_x86 = ["qemu"]
test_build = []

# When building for QEMU (raspi3b/raspi4b), secondary cores must be released via PSCI CPU_ON.
# QEMU's emulated firmware implements PSCI, not the classic Raspberry Pi ROM spin-table mechanism
# that real hardware uses, so the spin-table mailbox writes are otherwise silently ignored and no
# secondary core ever wakes up.
# On x86_64, enable QEMU's legacy COM1 UART instead of the Hyper-V console stub.
qemu = []

##-------------------------------------------------------------------------------------------------
## Dependencies
##-------------------------------------------------------------------------------------------------

[dependencies]
test-types = { path = "../libraries/test-types" }
debug-symbol-types = { path = "../libraries/debug-symbol-types" }
linked_list_allocator = { version = "0.10.x", default-features = false, features = ["const_mut_refs"] }

# Optional dependencies
tock-registers = { version = "0.8.x", default-features = false, features = ["register_types"], optional = true }
qemu-exit = { version = "3.x.x", optional = true }

# Platform specific dependencies
[target.'cfg(target_arch = "aarch64")'.dependencies]
aarch64-cpu = { version = "9.x.x" }

##-------------------------------------------------------------------------------------------------
## Testing
##-------------------------------------------------------------------------------------------------

[dev-dependencies]
test-macros = { path = "../libraries/test-macros" }

# Unit tests are done in the library part of the kernel.
[lib]
name = "libkernel"
test = true

# Disable unit tests for the kernel binary.
[[bin]]
name = "RustyPi5"
path = "src/main.rs"
test = false
